<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.F.C.D.E - Académie Football Club Dieu-Est | Agnibilékrou</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f5f5f5;color:#111}
.topbar{background:#0a0a0a;color:white;padding:8px 16px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:1px}
.topbar span{color:#facc15}
.topbar a{color:#facc15;text-decoration:none;font-weight:900}
header{background:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;box-shadow:0 2px 20px rgba(0,0,0,.1)}
.logo-zone{display:flex;align-items:center;gap:12px}
.logo-zone img{width:58px;height:58px;border-radius:50%;background:#eef2ff;object-fit:cover;border:2px solid #1d4ed8}
.logo-txt{font-weight:900;line-height:1;font-size:20px;letter-spacing:1px}
.logo-txt span{font-size:10px;letter-spacing:2px;color:#1d4ed8;display:block;margin-top:3px}
nav a{color:#111;text-decoration:none;margin-left:18px;font-size:13px;font-weight:700;letter-spacing:1px}
nav a.active{color:#1d4ed8;border-bottom:3px solid #facc15;padding-bottom:4px}
.hero{position:relative;height:480px;background:url('photo-equipe.jpg') center/cover no-repeat, linear-gradient(#1d4ed8,#111);display:flex;align-items:flex-end;color:white}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.75) 70%,rgba(0,0,0,.92) 100%)}
.hero-content{position:relative;z-index:2;padding:30px 20px 32px 20px;max-width:1000px;margin:auto;width:100%}
.hero .tag{background:#facc15;color:#111;padding:6px 14px;font-size:11px;font-weight:900;letter-spacing:2px;border-radius:3px}
.hero h1{font-size:52px;line-height:.95;font-weight:900;margin:14px 0}
.hero h1 span{color:#facc15}
.hero p{font-size:16px;opacity:.95;max-width:650px;line-height:1.5}
.hero .slogan{margin-top:14px;background:rgba(250,204,21,.95);color:#111;padding:12px 16px;border-radius:8px;font-weight:800;font-size:15px;line-height:1.4;max-width:650px}
.btn{padding:14px 26px;font-weight:800;font-size:13px;letter-spacing:1px;text-decoration:none;display:inline-block;border-radius:6px}
.btn-jaune{background:#facc15;color:#111}
.btn-bleu{background:#1d4ed8;color:white}
.btn-blanc{background:white;color:#111}
.btn-whatsapp{background:#25D366;color:white}
.btn-facebook{background:#1877F2;color:white}
.btn-messenger{background:#0084FF;color:white}
.btn-suivre{background:#42b72a;color:white}
.btns-dehors{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:20px 18px;background:#f5f5f5}
.bar3{display:flex;height:8px}
.bar3 div{flex:1}
.bar3 .b{background:#1d4ed8}.bar3 .w{background:white}.bar3 .j{background:#facc15}
section{max-width:1100px;margin:auto;padding:40px 18px}
h2{font-size:28px;font-weight:900;margin-bottom:6px}
h2 i{color:#1d4ed8;font-style:normal}
.sous{color:#666;margin-bottom:22px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:white;border-radius:8px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.card .img{height:120px;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:38px}
.card-body{padding:18px}
.card-body h3{font-size:16px;margin-bottom:6px}
.card-body p{font-size:14px;color:#555;line-height:1.6}
